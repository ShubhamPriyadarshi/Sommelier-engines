name: Build engine

on:
  workflow_dispatch:
    inputs:
      cx_version:
        description: "CrossOver sources version (e.g. 26.3.0)"
        required: true
        default: "26.3.0"

# The default workflow token is read-only, so creating a release 403s after a
# successful hour-long build. Scoped to contents rather than write-all.
permissions:
  contents: write

jobs:
  build:
    # macOS 14+ arm64 runners; the Unix side builds x86_64 under Rosetta,
    # which the runners support out of the box.
    runs-on: macos-14
    timeout-minutes: 180   # a full Wine build is 1–2 h; leave headroom
    steps:
      - uses: actions/checkout@v4

      # Checkpointing. Every failed run used to recompile ~30 minutes of
      # identical work to reach its failure point. Two caches fix that, and
      # both are saved with `if: always()` — the default save-on-success is
      # useless here, since failing runs are exactly the ones we resume from.
      #   downloads: source tarball + llvm-mingw, keyed on version (static)
      #   ccache:    object-level compile cache, rolling key
      - name: Restore downloads cache
        uses: actions/cache/restore@v4
        with:
          path: |
            work/crossover-sources-*.tar.gz
            work/llvm-mingw-*
          key: downloads-${{ inputs.cx_version }}-llvm20260616
      - name: Restore ccache
        uses: actions/cache/restore@v4
        with:
          path: work/ccache
          key: ccache-${{ inputs.cx_version }}-${{ github.run_id }}
          restore-keys: ccache-${{ inputs.cx_version }}-

      - name: Toolchain
        run: |
          # llvm-mingw is fetched by build.sh from its own releases; brew
          # covers the rest. No `|| true`: a missing dep should fail HERE.
          # Needs root on the runners, and a swallowed failure here surfaced
          # as "C compiler cannot create executables" an hour later: the Unix
          # side configures under `arch -x86_64`, which is Rosetta.
          sudo softwareupdate --install-rosetta --agree-to-license
          # bison runs natively at build time: arm64 brew is fine for it.
          brew install bison
          # The link-time dependencies must be x86_64 — run 5 proved the arm64
          # ones fail with "libgnutls 64-bit development files not found" — so
          # they come from a second Homebrew under Rosetta at /usr/local.
          # The bottles are prebuilt; this is minutes, not a source build.
          NONINTERACTIVE=1 arch -x86_64 /bin/bash -c \
            "$(curl -fsSL https://raw.githubusercontent.com/Homebrew/install/HEAD/install.sh)"
          # molten-vk is not optional: CrossOver's win32u assumes
          # SONAME_LIBVULKAN exists (their tree always ships MoltenVK, so they
          # dropped upstream's #ifdef), and DXVK needs winevulkan at runtime.
          # gstreamer closes the one compatibility gap this engine has against
          # an imported CrossOver: without it Wine builds no media backend and
          # any game with pre-rendered cutscenes skips or hangs on video.
          # gst-plugins-base is deliberately absent — Homebrew merged it into
          # gstreamer, so naming both asks brew to install one formula twice
          # and the whole batch exits 1. libusb covers USB devices; ordinary
          # controllers already work through winebus's IOHID and SDL backends.
          #
          # One at a time, so a link conflict on someone's dependency does not
          # take the rest down with it — the runner image ships several of
          # these already linked.
          # zlib is here for its .pc file, not its code. macOS ships the zlib
          # library but no zlib.pc — not in /usr/lib/pkgconfig (which holds
          # only apr and pcre) and not in the SDK — so gnutls.pc's
          # "Requires: zlib" cannot resolve, and gnutls drags GStreamer's
          # resolution down with it. brew's zlib is keg-only, so it lands in
          # opt/zlib/lib/pkgconfig where the keg sweep below picks it up and
          # never shadows the system library at link time.
          for formula in zlib gnutls freetype sdl2 pkgconf molten-vk gstreamer libusb; do
            arch -x86_64 /usr/local/bin/brew install "$formula" \
              || arch -x86_64 /usr/local/bin/brew link --overwrite "$formula" \
              || echo "::warning::$formula may be incomplete — asserted below"
          done

          # brew's exit code is not the thing that matters; whether the build
          # can find these is. Assert that, and fail here rather than 50
          # minutes later inside configure.
          #
          # configure finds gnutls by link test ("checking for -lgnutls..."),
          # never by .pc, so the file check below is the one that matches the
          # build. Note what the earlier pkg-config check on gnutls actually
          # was: not an over-strict assertion, but the first sighting of the
          # broken PKG_CONFIG_LIBDIR fixed below. Deleting it as a false alarm
          # removed the detector and left the bug, which then cost two runs
          # under a different name. Keep both checks.
          for lib in libgnutls.dylib libfreetype.dylib; do
            [ -e "/usr/local/lib/$lib" ] \
              || { echo "FATAL: /usr/local/lib/$lib missing"; exit 1; }
            echo "  ok: $lib"
          done
          [ -e /usr/local/include/freetype2/ft2build.h ] \
            || { echo "FATAL: freetype headers missing"; exit 1; }
          echo "  ok: ft2build.h"

          # A single-directory PKG_CONFIG_LIBDIR made gstreamer-1.0.pc present
          # and unresolvable at once: Homebrew keeps keg-only formulas out of
          # lib/pkgconfig, so a transitive Requires: on icu4c or openssl@3 has
          # nowhere to resolve from. Enumerate every keg under the x86_64
          # prefix — still all /usr/local, so arm64 remains excluded. build.sh
          # builds the identical path and is the authoritative gate; this runs
          # first only so a broken toolchain fails in seconds, not after the
          # compile. --print-errors makes a failure name the missing package.
          PKGCONF=/usr/local/bin/pkgconf
          [ -x "$PKGCONF" ] || PKGCONF=/usr/local/bin/pkg-config
          [ -x "$PKGCONF" ] || { echo "FATAL: no x86_64 pkg-config"; exit 1; }
          PC_DIRS=/usr/local/lib/pkgconfig:/usr/local/share/pkgconfig
          for d in /usr/local/opt/*/lib/pkgconfig /usr/local/opt/*/share/pkgconfig; do
            [ -d "$d" ] && PC_DIRS="$PC_DIRS:$d"
          done
          # System pkgconfig last: zlib ships with macOS, not brew, and
          # gnutls requires it. Homebrew still wins any name collision.
          [ -d /usr/lib/pkgconfig ] && PC_DIRS="$PC_DIRS:/usr/lib/pkgconfig"
          export PKG_CONFIG_LIBDIR="$PC_DIRS"
          echo "=== pkg-config resolution ==="
          echo "search dirs: $(echo "$PC_DIRS" | tr ':' '\n' | wc -l)"
          # Locate the .pc files that have actually gone missing, so a repeat
          # failure names its own cause instead of costing a run to find.
          for pc in zlib gnutls gstreamer-1.0; do
            hit=$(echo "$PC_DIRS" | tr ':' '\n' \
                  | while read -r d; do [ -e "$d/$pc.pc" ] && echo "$d" && break; done)
            echo "  $pc.pc: ${hit:-NOT ON THE SEARCH PATH}"
          done
          for pc in glib-2.0 gnutls gstreamer-1.0 gstreamer-app-1.0 gstreamer-video-1.0; do
            if "$PKGCONF" --print-errors --exists "$pc"; then
              echo "  ok: $pc $("$PKGCONF" --modversion "$pc")"
            else
              echo "FATAL: $pc does not resolve"; exit 1
            fi
          done
          # ccache comes from its own release, not brew: brew kept failing to
          # pour it (a dependency is already linked on the runner image) and
          # the failure was swallowed by a fallback, so ten runs compiled
          # uncached while the logs claimed checkpointing was in place.
          # Pinned, like llvm-mingw, so builds stay reproducible.
          CCACHE_VERSION=4.13.6
          curl -fL -o /tmp/ccache.tar.gz \
            "https://github.com/ccache/ccache/releases/download/v$CCACHE_VERSION/ccache-$CCACHE_VERSION-darwin.tar.gz"
          tar -xzf /tmp/ccache.tar.gz -C /tmp
          sudo install -m 0755 "/tmp/ccache-$CCACHE_VERSION-darwin/ccache" /usr/local/bin/ccache
          # No fallback: if the cache tool is missing we want to know here,
          # not from a 50-minute build that silently recompiled everything.
          ccache --version
          ls -la /usr/local/bin/ | grep -i pkg || true
          ls /usr/local/lib/pkgconfig/ | head -20 || true

      - name: Build
        env:
          CX_VERSION: ${{ inputs.cx_version }}
        run: ./scripts/build.sh

      - name: Assemble bundle
        env:
          CX_VERSION: ${{ inputs.cx_version }}
        run: ./scripts/assemble-bundle.sh

      - name: Save downloads cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: |
            work/crossover-sources-*.tar.gz
            work/llvm-mingw-*
          key: downloads-${{ inputs.cx_version }}-llvm20260616
      - name: Save ccache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: work/ccache
          key: ccache-${{ inputs.cx_version }}-${{ github.run_id }}

      # configure buries the real error in config.log; without this step a
      # failure is a useless one-liner.
      - name: Dump config.log on failure
        if: failure()
        # The failed compile invocation lives mid-file, not at the tail.
        run: grep -B4 -A18 -E "failed program was|error:|cannot" work/build/config.log | head -120 || true

      # The release IS the compliance mechanism: binaries and their complete
      # corresponding source are attached to the same tag, so neither can be
      # published without the other.
      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: WS12WineSommelier${{ inputs.cx_version }}
          draft: true   # verified on a real machine before publishing — see README
          files: |
            work/WS12WineSommelier${{ inputs.cx_version }}.tar.xz
            work/sommelier-engine-patches-${{ inputs.cx_version }}.tar.gz
            work/crossover-sources-${{ inputs.cx_version }}.tar.gz
          body_path: work/source-sha256.txt
